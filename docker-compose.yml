services:
  db:
    image: postgres:16-alpine
    container_name: ai_decision_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_decision_engine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_decision_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_decision_app
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/ai_decision_engine
    ports:
      - "8000:8000"
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
    # ISSUE-005: DB-bagimli healthcheck. `/health` 200 donse bile DB endpoint'leri
    # bozuk olabiliyordu (failed recreate sonrasi network/port drift). Burada
    # gercek DB query'si yapan endpoint'i hit ediyoruz.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/scenarios?limit=1', timeout=3).status == 200 else 1)\""
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  postgres_data:
